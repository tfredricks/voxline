name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run: skip gh-pages push and release upload; emit artifacts only'
        type: boolean
        default: true

permissions:
  contents: write  # to upload the DMG to the release and push to gh-pages

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    # 'bash' here means `bash --noprofile --norc -eo pipefail` so that
    # `xcodebuild ... | xcbeautify` propagates xcodebuild's exit code.
    shell: bash

jobs:
  build-and-publish:
    name: Build, sign, notarize, publish
    runs-on: macos-15
    timeout-minutes: 60
    env:
      KEYCHAIN_NAME: voxline-release.keychain
      KEYCHAIN_PASSWORD: ${{ github.run_id }}
      # true only when manually dispatched with the dry_run input ticked;
      # tag pushes always evaluate to 'false'.
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Select latest Xcode 16
        run: |
          # shellcheck disable=SC2012
          XCODE=$(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort -V | tail -1)
          if [[ -z "$XCODE" ]]; then
            echo "No Xcode 16.x found on runner" >&2
            exit 1
          fi
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Determine version
        id: ver
        run: |
          if [[ "$DRY_RUN" == "true" ]]; then
            TAG="v0.0.0-dryrun.${{ github.run_number }}"
            VERSION="0.0.0-dryrun.${{ github.run_number }}"
          else
            TAG="${GITHUB_REF##*/}"      # v1.0.1
            VERSION="${TAG#v}"            # 1.0.1
          fi
          BUILD="$(git rev-list --count HEAD)"
          {
            echo "tag=$TAG"
            echo "version=$VERSION"
            echo "build=$BUILD"
          } >> "$GITHUB_OUTPUT"

      - name: Pre-flight checks
        run: |
          if grep -q 'REPLACE_WITH_REAL_KEY' voxline/Info.plist; then
            echo "ERROR: SUPublicEDKey in voxline/Info.plist is still the placeholder." >&2
            echo "Run the one-time setup in docs/release/RELEASE.md before tagging a release." >&2
            exit 1
          fi

      - name: Install xcbeautify
        run: brew install xcbeautify

      - name: Create temporary keychain
        run: |
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_NAME"
          security set-keychain-settings -lut 3600 "$KEYCHAIN_NAME"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_NAME"
          # shellcheck disable=SC2046
          security list-keychains -d user -s "$KEYCHAIN_NAME" \
            $(security list-keychains -d user | tr -d '"')
          security default-keychain -s "$KEYCHAIN_NAME"

      - name: Import Developer ID certificate
        env:
          CERT_B64: ${{ secrets.DEVELOPER_ID_CERT_P12 }}
          CERT_PWD: ${{ secrets.DEVELOPER_ID_CERT_PASSWORD }}
        run: |
          CERT_PATH="$RUNNER_TEMP/cert.p12"
          echo "$CERT_B64" | base64 --decode > "$CERT_PATH"
          security import "$CERT_PATH" \
            -k "$KEYCHAIN_NAME" \
            -P "$CERT_PWD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_NAME"
          rm "$CERT_PATH"

      - name: Write notarization API key
        env:
          NOTARY_KEY: ${{ secrets.APPLE_NOTARY_API_KEY_P8 }}
        run: |
          mkdir -p "$RUNNER_TEMP/notary"
          printf '%s' "$NOTARY_KEY" > "$RUNNER_TEMP/notary/AuthKey.p8"
          chmod 600 "$RUNNER_TEMP/notary/AuthKey.p8"

      - name: Install Developer ID provisioning profile
        id: profile
        env:
          PROFILE_B64: ${{ secrets.DEVELOPER_ID_PROFILE }}
        run: |
          PROFILES_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILES_DIR"
          PROFILE_PATH="$PROFILES_DIR/voxline_developer_id.provisionprofile"
          echo "$PROFILE_B64" | base64 --decode > "$PROFILE_PATH"
          # The profile is CMS-wrapped; decode to read its Name and UUID.
          DECODED="$RUNNER_TEMP/profile.plist"
          security cms -D -i "$PROFILE_PATH" > "$DECODED"
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c "Print :Name" "$DECODED")
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c "Print :UUID" "$DECODED")
          echo "Installed profile: $PROFILE_NAME ($PROFILE_UUID)"
          echo "name=$PROFILE_NAME" >> "$GITHUB_OUTPUT"
          echo "uuid=$PROFILE_UUID" >> "$GITHUB_OUTPUT"

      - name: Resolve Swift packages
        run: |
          xcodebuild -resolvePackageDependencies \
            -scheme voxline \
            -project voxline.xcodeproj

      - name: Archive Release build
        env:
          NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: |
          xcodebuild \
            -project voxline.xcodeproj \
            -scheme voxline \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -archivePath "$RUNNER_TEMP/voxline.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/notary/AuthKey.p8" \
            -authenticationKeyID "$NOTARY_KEY_ID" \
            -authenticationKeyIssuerID "$NOTARY_ISSUER_ID" \
            CURRENT_PROJECT_VERSION="${{ steps.ver.outputs.build }}" \
            MARKETING_VERSION="${{ steps.ver.outputs.version }}" \
            archive | xcbeautify

      - name: Export signed .app
        env:
          PROFILE_NAME: ${{ steps.profile.outputs.name }}
        run: |
          # Manual signing: avoids Apple's cloud-signing path, which fails
          # for locally-issued Developer ID certs whose private key Apple
          # doesn't hold.
          cat > "$RUNNER_TEMP/exportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>developer-id</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>teamID</key>
            <string>2B5FBFV6CF</string>
            <key>signingCertificate</key>
            <string>Developer ID Application</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.voxline.app</key>
              <string>${PROFILE_NAME}</string>
            </dict>
          </dict>
          </plist>
          EOF
          xcodebuild \
            -exportArchive \
            -archivePath "$RUNNER_TEMP/voxline.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/exportOptions.plist" | xcbeautify
          ls -la "$RUNNER_TEMP/export"

      - name: Notarize and staple
        run: |
          APP="$RUNNER_TEMP/export/voxline.app"
          ZIP="$RUNNER_TEMP/voxline.zip"
          /usr/bin/ditto -c -k --keepParent "$APP" "$ZIP"
          xcrun notarytool submit "$ZIP" \
            --key "$RUNNER_TEMP/notary/AuthKey.p8" \
            --key-id "${{ secrets.APPLE_NOTARY_KEY_ID }}" \
            --issuer "${{ secrets.APPLE_NOTARY_ISSUER_ID }}" \
            --wait
          xcrun stapler staple "$APP"
          xcrun stapler validate "$APP"

      - name: Package DMG
        run: |
          brew install create-dmg
          APP="$RUNNER_TEMP/export/voxline.app"
          DMG="$RUNNER_TEMP/voxline-${{ steps.ver.outputs.version }}.dmg"
          create-dmg \
            --volname "voxline ${{ steps.ver.outputs.version }}" \
            --hdiutil-quiet \
            --no-internet-enable \
            --hide-extension voxline.app \
            "$DMG" \
            "$APP"
          ls -la "$DMG"

      - name: Install Sparkle CLI tools
        run: |
          # Pinned to match the Sparkle SPM dependency version. The
          # SPM-distributed Sparkle.framework doesn't bundle generate_appcast
          # / sign_update, so we fetch them from the official tarball.
          SPARKLE_VERSION=2.9.2
          DEST="$RUNNER_TEMP/sparkle"
          mkdir -p "$DEST"
          curl -sSL "https://github.com/sparkle-project/Sparkle/releases/download/${SPARKLE_VERSION}/Sparkle-${SPARKLE_VERSION}.tar.xz" \
            | tar -xJ -C "$DEST"
          test -x "$DEST/bin/generate_appcast"
          test -x "$DEST/bin/sign_update"
          echo "$DEST/bin" >> "$GITHUB_PATH"

      - name: Checkout gh-pages
        if: env.DRY_RUN != 'true'
        uses: actions/checkout@v6
        with:
          ref: gh-pages
          path: gh-pages

      - name: Regenerate appcast
        run: |
          GEN="$(command -v generate_appcast)"
          STAGE="$RUNNER_TEMP/appcast-stage"
          mkdir -p "$STAGE"
          cp "$RUNNER_TEMP/voxline-${{ steps.ver.outputs.version }}.dmg" "$STAGE/"
          NOTES_HTML="$RUNNER_TEMP/release-notes.html"
          if [[ "$DRY_RUN" == "true" ]]; then
            echo "Dry-run build from ${GITHUB_SHA:0:8} on $(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              > "$RUNNER_TEMP/release-notes.md"
          else
            git for-each-ref refs/tags/${{ steps.ver.outputs.tag }} \
              --format='%(contents)' > "$RUNNER_TEMP/release-notes.md"
          fi
          python3 -c "import markdown,sys; print(markdown.markdown(open('$RUNNER_TEMP/release-notes.md').read()))" \
            > "$NOTES_HTML" 2>/dev/null || cp "$RUNNER_TEMP/release-notes.md" "$NOTES_HTML"
          echo "${{ secrets.SPARKLE_ED_PRIVATE_KEY }}" > "$RUNNER_TEMP/ed_key.pem"
          "$GEN" \
            --ed-key-file "$RUNNER_TEMP/ed_key.pem" \
            --download-url-prefix "https://github.com/tfredricks/voxline/releases/download/${{ steps.ver.outputs.tag }}/" \
            --release-notes-url-prefix "https://tfredricks.github.io/voxline/notes/" \
            -o "$RUNNER_TEMP/new-appcast.xml" \
            "$STAGE"
          rm "$RUNNER_TEMP/ed_key.pem"

          xmllint --noout "$RUNNER_TEMP/new-appcast.xml"
          grep -q 'sparkle:edSignature="..*"' "$RUNNER_TEMP/new-appcast.xml" \
            || { echo "appcast missing edSignature" >&2; exit 1; }

          if [[ "$DRY_RUN" != "true" ]]; then
            cp "$RUNNER_TEMP/new-appcast.xml" gh-pages/appcast.xml
            mkdir -p "gh-pages/notes"
            cp "$NOTES_HTML" "gh-pages/notes/${{ steps.ver.outputs.version }}.html"
          fi

      - name: Publish appcast to gh-pages
        if: env.DRY_RUN != 'true'
        run: |
          cd gh-pages
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add appcast.xml notes/
          if git diff --cached --quiet; then
            echo "No appcast changes to publish."
          else
            git commit -m "release: appcast for ${{ steps.ver.outputs.tag }}"
            git push origin gh-pages
          fi

      - name: Upload DMG to the GitHub Release
        if: env.DRY_RUN != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          files: |
            ${{ runner.temp }}/voxline-${{ steps.ver.outputs.version }}.dmg
          body_path: ${{ runner.temp }}/release-notes.md
          fail_on_unmatched_files: true

      - name: Upload dry-run artifacts
        if: env.DRY_RUN == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: voxline-dryrun-${{ steps.ver.outputs.version }}
          path: |
            ${{ runner.temp }}/voxline-${{ steps.ver.outputs.version }}.dmg
            ${{ runner.temp }}/new-appcast.xml
            ${{ runner.temp }}/release-notes.md
          if-no-files-found: error
          retention-days: 14

      - name: Clean up keychain
        if: always()
        run: |
          security default-keychain -s login.keychain || true
          security delete-keychain "$KEYCHAIN_NAME" || true
          rm -f "$RUNNER_TEMP/notary/AuthKey.p8" || true
